[project]
name = "retool-clone-list-metadata-helper"
description = "Validates, cleans, and gets Retool clone lists and metadata"
version="1.2"
requires-python = ">=3.14"
dependencies = [
    "json-source-map>=1.0.5",
    "jsonpath-ng>=1.7.0",
    "jsonschema>=4.25.1",
    "lxml>=5.4.0",
    "natsort>=8.4.0",
    "requests>=2.32.5",
    "types-jsonschema",
    "types-requests",
]

[tool.setuptools]
py-modules = ["scripts"]

# Use UV for dependency installation
[tool.hatch.envs.default]
installer = "uv"
path = ".venv"
python = "3.14"

[tool.hatch.envs.default.scripts]
all = [
    "hatch run style:fix",
    "hatch run types:check",
    "hatch run lint:check",
]

# Hatch lint setup and scripts
[tool.hatch.envs.lint]
installer = "uv"
detached = true
dependencies = ["codespell"]

[tool.hatch.envs.lint.scripts]
spelling = 'codespell scripts *.* -L ue'
check = ["spelling"]

# Hatch style setup and scripts
[tool.hatch.envs.style]
installer = "uv"
detached = true
dependencies = ["ruff"]

[tool.hatch.envs.style.scripts]
check = [
    "ruff check scripts {args}",
    "ruff format --check scripts",
]

fix = [
    "ruff check --fix scripts",
    "ruff format scripts",
]

# Hatch types setup and scripts
[tool.hatch.envs.types]
installer = "uv"
dependencies = [
    "mypy>=1.8.0",
]

[tool.hatch.envs.types.scripts]
check = [
    "mypy --strict --python-version=3.10 scripts",
]

# Hatch tool configuration
[tool.mypy]
warn_unreachable = true
no_implicit_optional = true
show_error_codes = true

[tool.ruff]
line-length = 90

[tool.ruff.format]
skip-magic-trailing-comma = true
quote-style = "preserve"

[tool.ruff.lint]
select = [
    # --- Core Python, general best practices ---
    "F",    # Pyflakes (syntax/runtime errors)
    "W",    # pycodestyle warnings
    "E",    # pycodestyle errors
    "UP",   # pyupgrade (modernize Python syntax)
    "YTT",  # flake8-2020 (misuse of sys.version)
    "C4",   # flake8-comprehensions (better list/dict/set comps)
    "DTZ",  # flake8-datetimez (naive datetimes)
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie (random/misc utility checks)
    "T20",  # flake8-print (disallow print statements)
    "RSE",  # flake8-raise (simplify raise statements)

    # --- Logic, bugs & safety (Bugbear) ---
    "B002", "B003", "B005", "B007", "B009", "B012", "B013", "B014", "B015",
    "B018", "B020", "B021", "B023", "B026", "B033", "B034", "B905",

    # --- Flake8 simplify ---
    "SIM101", "SIM107", "SIM201", "SIM202", "SIM208", "SIM210", "SIM211", "SIM300", "SIM401", "SIM910",

    # --- Formatting & syntax ---
    "I",    # isort
    "COM818", # flake8-commas

    # --- Logging & performance ---
    "G010",   # flake8-logging-format
    "PERF101", # perflint
    "FLY002",  # flynt

    # --- Pydocstyle ---
    "D200", "D201", "D202", "D204", "D207", "D208", "D209", "D210", "D211",
    "D213", "D214", "D300", "D301", "D400", "D402", "D403", "D405", "D412",
    "D414", "D415", "D416", "D417", "D419",

    # --- Pylint rules ---
    "PLC", "PLE", # Pylint Convention/Error
    "PLR0124", "PLR0133", "PLR0206", "PLR0402", "PLR1722", # Pylint Refactor
    "PLW0120", "PLW0127", "PLW0129", "PLW0131", "PLW0406", "PLW0602", "PLW0603", "PLW0711", # Pylint Warning

    # --- Ruff-specific features ---
    "RUF001", "RUF005", "RUF007", "RUF010", "RUF013", "RUF100", "RUF200",

    # --- Safety & refactoring ---
    "PGH004", "PGH005", # pygrep-hooks
]
ignore = ["E501", "E731", "PLC0206", "PLC0415", "T201"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
split-on-trailing-comma=false
known-first-party = ["retool"]
