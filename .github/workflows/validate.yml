name: Clone list validator
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to revalidate'
        required: true
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post comments and reviews
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'
    - name: Set up git
      # Set up the Git username and email
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
    - name: Checkout clone lists repo
      uses: actions/checkout@v7
      with:
        path: retool-clonelists-metadata
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install Hatch
      run: uv tool install hatch
    - name: Validate clone list
      env:
        PR_NUMBER: ${{ github.event.number }}
        COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        CLONELISTS_PAT: ${{secrets.CLONELISTS_PAT}}
      run: |
        hatch run python3 -u retool-clonelists-metadata/scripts/clone_list_validate.py
